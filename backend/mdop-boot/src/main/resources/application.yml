spring:
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: mdop-platform

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/system
      - classpath:db/migration/masterdata
      - classpath:db/migration/purchasing
      - classpath:db/migration/sales
      - classpath:db/migration/wms
      - classpath:db/migration/integration
    encoding: UTF-8
    validate-on-migrate: true
    validate-migration-naming: true
    fail-on-missing-locations: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

mdop:
  time-zone: ${MDOP_TIME_ZONE:Asia/Shanghai}
  messaging:
    enabled: false
  auth:
    username: ${MDOP_ADMIN_USERNAME:admin}
    password: ${MDOP_ADMIN_PASSWORD:}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
