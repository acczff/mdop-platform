# 生产部署默认在 TLS 终止之后，会话 Cookie 强制只经 HTTPS 传输。
server:
  servlet:
    session:
      cookie:
        secure: true

logging:
  structured:
    format:
      console: ecs
  level:
    io.github.acczff.mdop: INFO

management:
  server:
    address: ${MDOP_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MDOP_MANAGEMENT_PORT:8091}
  endpoint:
    health:
      show-details: never
