server:
  # 与前端开发代理默认目标一致；mdop.ps1 仍可用 --server.port 覆盖
  port: ${MDOP_BACKEND_PORT:8081}

spring:
  # IDEA 直接启动时没有 mdop.ps1 注入环境变量，这里按工作目录候选加载 .env.local。
  # optional: 缺失时静默跳过；CI 与容器环境仍以真实环境变量为准。
  config:
    import:
      - optional:file:../../deploy/env/.env.local[.properties]
      - optional:file:../deploy/env/.env.local[.properties]
      - optional:file:deploy/env/.env.local[.properties]
  rabbitmq:
    host: 127.0.0.1
    port: ${MDOP_RABBITMQ_AMQP_PORT}
    virtual-host: ${MDOP_RABBITMQ_VHOST}
    username: ${MDOP_RABBITMQ_USER}
    password: ${MDOP_RABBITMQ_PASSWORD}
  datasource:
    url: "jdbc:mysql://127.0.0.1:${MDOP_MYSQL_PORT}/${MDOP_MYSQL_DATABASE}"
    username: "${MDOP_MYSQL_USER}"
    password: "${MDOP_MYSQL_PASSWORD}"
  data:
    redis:
      host: 127.0.0.1
      port: ${MDOP_REDIS_PORT:6379}
      password: ${MDOP_REDIS_PASSWORD:}

logging:
  level:
    io.github.acczff.mdop: DEBUG

mdop:
  auth:
    # 仅本地开发允许短口令；test 与 prod 仍按默认 12 位校验
    password-min-length: 5
  messaging:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
